# Списки проверяемых ресурсов для connect-check (рядом с бинарём).
# connect-check-version: 1.4.3

# resources-format: 1
# Если файла нет — используются встроенные списки из программы.
#
# Формат: секции [group], строки «поле|поле|…». Пустые строки и # — комментарии.
# Пробелы вокруг | обрезаются.
# Секции: popular_ru, significant, banks, video, games_tcp, games_https,
#         infra_tcp, infra_https, geo, updates, ai (TCP).
#
# Правила (дивизион):
# - один URL — в одной секции (без дублей popular_ru↔significant↔banks↔geo↔infra↔updates);
# - origin+CDN в играх — complementary, оставляем;
# - yandex.ru/ya.ru, vk.com/vk.ru, tbank/tinkoff — intentional pairs;
# - стриминг (Twitch/Kick) — в games как gaming-adjacent.

